<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CamFiesta</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- Copied ALL styles directly from your login page --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: 'Open Sans', sans-serif;
            overflow-x: hidden;
            background: #ffffff;
            min-height: 100vh;
        }

        /* Animated Background Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            animation: float 6s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Header Styles */
        .header {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .name1 {
            color: white;
            font-size: 2.5em;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), 0 0 10px rgba(255, 255, 255, 0.2);
            }
            to {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.4);
            }
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 400;
            transition: all 0.3s ease;
            position: relative;
            padding: 5px 0;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background: white;
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            transform: translateY(-2px);
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.3);
        }

        /* Mobile Navigation */
        .mobile-nav-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.8em;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.3s ease;
        }

        .mobile-nav-toggle:hover {
            transform: rotate(90deg);
        }

        .mobile-nav {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            flex-direction: column;
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideDown 0.3s ease-out;
        }

        .mobile-nav.active {
            display: flex;
        }

        .mobile-nav a {
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .mobile-nav a:hover {
            color: #ff6b6b;
            padding-left: 10px;
        }

        .mobile-nav a:last-child {
            border-bottom: none;
        }

        /* Main Content */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px); /* Adjusted for taller form */
            padding: 40px 20px;
            position: relative;
            z-index: 2;
        }

        .login-container {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(0, 0, 0, 0.2);
            max-width: 480px; /* Wider for more fields */
            width: 100%;
            animation: fadeInUp 1s ease-out;
            position: relative;
            overflow: hidden;
            color: white;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-title {
            font-size: 2.5em;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            animation: slideInFromLeft 0.8s ease-out 0.2s both;
        }

        .login-subtitle {
            font-size: 1.1em;
            color: #ccc;
            animation: slideInFromRight 0.8s ease-out 0.4s both;
        }

        @keyframes slideInFromLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInFromRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* Form Styles */
        .form-group {
            position: relative;
            margin-bottom: 20px;
            animation: fadeInUp 0.6s ease-out 0.6s both;
        }

        .input-wrapper {
            position: relative;
        }

        .input-box {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            color: #333;
            background: white;
            transition: all 0.3s ease;
            font-family: 'Open Sans', sans-serif;
        }

        .input-box:focus {
            border-color: #fff;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
            outline: none;
            transform: scale(1.02);
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            transition: color 0.3s ease;
        }

        .input-box:focus + .input-icon {
            color: #333; /* Darker icon color on focus */
        }
        
        /* Button Styles */
        .button-group {
            text-align: center;
            margin-top: 30px;
        }

        .submit-btn {
            background: linear-gradient(45deg, #000, #333);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            width: 100%;
            animation: fadeInUp 0.6s ease-out 1.2s both;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .login-btn-link {
            background: white;
            color: #000;
            border: 2px solid #000;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            animation: fadeInUp 0.6s ease-out 1.4s both;
        }

        .login-btn-link:hover {
            background: #000;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* Error Messages */
        .error-messages {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .error-messages p {
            color: #d32f2f;
            font-size: 14px;
            text-align: center;
            margin: 5px 0;
        }

        /* Footer */
        .footer {
            background: rgba(0, 0, 0, 0.8);
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            padding: 30px;
            font-size: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 1s ease-out 1.6s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: row; /* Keep header items in a row */
                justify-content: space-between;
            }
            .nav-links { display: none; }
            .mobile-nav-toggle { display: block; }
            .login-container { margin: 20px; padding: 40px 30px; }
            .login-title { font-size: 2em; }
        }

        @media (max-width: 480px) {
            .login-container { padding: 30px 20px; }
            .login-title { font-size: 1.8em; }
            .input-box { padding: 12px 15px 12px 45px; }
            .submit-btn { padding: 12px 35px; }
        }

        /* Loading Animation */
        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-left: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    {% load static %}

    <div class="particles" id="particles"></div>

    <header class="header">
        <div class="header-content">
            <h2 class="name1">CamFiesta</h2>
            
            <nav class="nav-links">
                <a href="{% url 'home' %}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 5px; vertical-align: middle;">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                    </svg>
                    Home
                </a>
                <a href="{% url 'login' %}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 5px; vertical-align: middle;">
                       <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v-2h8v2zm0-4h-8v-2h8v2zm0-4h-8V9h8v2z"/>
                    </svg>
                    Sign In
                </a>
            </nav>

            <button class="mobile-nav-toggle" onclick="toggleMobileNav()">☰</button>

            <nav class="mobile-nav" id="mobileNav">
                <a href="{% url 'home' %}" onclick="closeMobileNav()">🏠 Home</a>
                <a href="{% url 'login' %}" onclick="closeMobileNav()">🔒 Sign In</a>
            </nav>
        </div>
    </header>

    <div class="main-content">
        <div class="login-container">
            <div class="login-header">
                <h2 class="login-title">Create Account</h2>
                <p class="login-subtitle">Join CamFiesta today!</p>
            </div>

            {% if messages %}
                <div class="error-messages">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <form id="registerForm" method="POST" onsubmit="return validatePasswords()">
                {% csrf_token %}
                
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="text" class="input-box" name="first_name" placeholder="First Name" required>
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                           <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="text" class="input-box" name="last_name" placeholder="Last Name" required>
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                           <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="text" class="input-box" name="username" placeholder="Username" required>
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                           <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </div>
                </div>

                 <div class="form-group">
                    <div class="input-wrapper">
                        <input type="email" class="input-box" name="email" placeholder="Email Address" required>
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                           <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                        </svg>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="password" class="input-box" name="password" placeholder="Password" id="password" required>
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                    </div>
                </div>
                
                 <div class="form-group">
                    <div class="input-wrapper">
                        <input type="password" class="input-box" name="confirm_password" placeholder="Confirm Password" id="confirm_password" required>
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                           <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                    </div>
                </div>

                <div class="button-group">
                    <button class="submit-btn" type="submit" id="submitBtn">
                        <span class="btn-text">Sign Up</span>
                        <div class="loading">
                            <div class="spinner"></div>
                        </div>
                    </button>
                </div>
            </form>

            <div style="text-align: center; margin-top: 25px;">
                <p style="color: #ccc; margin-bottom: 15px;">Already have an account?</p>
                <a href="{% url 'login' %}" class="login-btn-link">Sign In Here</a>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>All rights are reserved | CamFiesta © 2024</p>
    </footer>

    <script>
        // --- Copied ALL scripts directly from your login page ---
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            if (!particlesContainer) return;
            const particleCount = window.innerWidth < 768 ? 15 : 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        function toggleMobileNav() {
            const mobileNav = document.getElementById('mobileNav');
            mobileNav.classList.toggle('active');
        }

        function closeMobileNav() {
             const mobileNav = document.getElementById('mobileNav');
             mobileNav.classList.remove('active');
        }

        // Validate that passwords match before submitting
        function validatePasswords() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (password !== confirmPassword) {
                alert("Passwords do not match. Please try again.");
                return false; // Prevent form submission
            }
            return true; // Allow form submission
        }

        // Form Submission with Loading Animation
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            // First, run password validation
            if (!validatePasswords()) {
                e.preventDefault(); // Stop the form submission if passwords don't match
                return;
            }

            // If passwords match, show loading animation
            const submitBtn = document.getElementById('submitBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const loading = submitBtn.querySelector('.loading');
            
            btnText.style.opacity = '0';
            loading.style.display = 'block';
            submitBtn.disabled = true;
        });

        // Initialize particles
        window.addEventListener('DOMContentLoaded', function() {
            createParticles();
        });
    </script>
</body>
</html>
